name: Build and release Tesseract

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Serialize runs for the same tag, including reruns; never cancel an active release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.triplet }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            triplet: arm64-linux
            archive: tar.gz
          - runner: ubuntu-24.04
            triplet: x64-linux
            archive: tar.gz
          - runner: windows-2025
            triplet: x64-windows-static
            archive: zip
          - runner: macos-15
            triplet: arm64-osx
            archive: tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out pinned vcpkg and validate Tesseract version
        shell: bash
        run: python .github/scripts/checkout-vcpkg.py

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        shell: bash
        run: bash .github/scripts/bootstrap-vcpkg.sh

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/bootstrap-vcpkg.ps1

      - name: Install Tesseract with vcpkg
        if: runner.os != 'Windows'
        shell: bash
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
          TRIPLET: ${{ matrix.triplet }}
        run: bash .github/scripts/install-tesseract.sh

      - name: Install Tesseract with vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TRIPLET: ${{ matrix.triplet }}
        run: ./.github/scripts/install-tesseract.ps1

      - name: Package Tesseract binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          TRIPLET: ${{ matrix.triplet }}
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: bash .github/scripts/package-tesseract.sh

      - name: Package Tesseract binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TRIPLET: ${{ matrix.triplet }}
        run: ./.github/scripts/package-tesseract.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: tesseract-${{ matrix.triplet }}
          path: dist/tesseract-${{ matrix.triplet }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tesseract-*
          path: release-assets
          merge-multiple: true

      - name: Create draft, upload assets, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: .github/scripts/publish-release.sh
